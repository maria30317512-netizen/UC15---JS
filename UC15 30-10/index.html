<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="cabecalho">
            <div class="icone">📚</div>
            <h1>Sistema de Consulta de Notas</h1>
            <p>Consulte a média e a situação acadêmica do estudante.</p>
        </header>

        <section class="formulario">
            <h2>Dados do estudante</h2>

            <form id="formNotas">
                <div class="campo">
                    <label for="nome">Nome do estudante</label>
                    <input type="text" id="nome" placeholder="Digite o nome do estudante">
                </div>

                <div class="notas">
                    <div class="campo">
                        <label for="nota1">Nota 1</label>
                        <input type="number" id="nota1" placeholder="0 a 10" min="0" max="10" step="any">
                    </div>

                    <div class="campo">
                        <label for="nota2">Nota 2</label>
                        <input type="number" id="nota2" placeholder="0 a 10" min="0" max="10" step="any">
                    </div>

                    <div class="campo">
                        <label for="nota3">Nota 3</label>
                        <input type="number" id="nota3" placeholder="0 a 10" min="0" max="10" step="any">
                    </div>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-calcular">Calcular média</button>
                    <button type="button" class="btn-limpar" id="btnLimpar">Reiniciar</button>
                </div>
            </form>

            <div id="resultado" class="resultado" aria-live="polite" hidden>
                <h2>Resultado da consulta</h2>
                <p id="nomeResultado"></p>

                <div class="media-box">
                    <span>Média final</span>
                    <strong id="mediaResultado"></strong>
                </div>

                <p class="situacao-texto">Situação acadêmica</p>
                <div id="situacaoResultado" class="situacao"></div>
            </div>

            <p id="mensagemErro" class="mensagem-erro" role="alert"></p>
        </section>

        <footer>
            <p>Sistema de Consulta de Notas &copy; 2026</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
